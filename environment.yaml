name: MSAuto
channels:
  - conda-forge
dependencies:
  - python=3.12
  # core pipeline + GUI
  - numpy>=2.0
  - scipy>=1.14
  - matplotlib>=3.9
  - pyqt=5.15
  - pyyaml>=6.0
  - openpyxl>=3.1
  - psutil>=6.0
  - pywavelets>=1.6
  - pandas>=2.2,<3
  # analysis tabs / reports
  - scikit-learn>=1.5
  - statsmodels>=0.14,<0.15
  - seaborn>=0.13
  # noise model / data generator
  - lmfit>=1.3
  - pybaselines>=1.1
  # analysis scripts
  - hdbscan>=0.8
  # build the windows app
  - pyinstaller>=6.0
  - pytest
  - pip
  - pip:
      - critband>=0.2.3
      - wqio>=0.7.2
      - scikit-posthocs>=0.14
      - -e .
